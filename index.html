<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Intercambio Navideño</title>
  <meta name="description" content="Escribe lo que te gustaría recibir y mira lo que quiere la persona a la que le regalas.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">

  <!-- Vista previa cuando se comparte el link por WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Intercambio Navideño">
  <meta property="og:description" content="Toca aquí para escribir lo que te gustaría recibir y ver lo que quiere la persona a la que le regalas.">
  <meta property="og:image" content="https://csaugusto.github.io/intercambio/img/compartir.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <link rel="icon" href="img/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icono-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="css/estilos.css?v=7">
</head>
<body>
  <header class="encabezado">
    <div class="encabezado-interior">
      <p class="encabezado-titulo" id="titulo">Intercambio Navideño</p>
      <p class="encabezado-detalles" id="detalles" hidden></p>
    </div>
  </header>

  <div class="aviso-demo" id="aviso-demo" hidden>
    <p><strong>Modo de prueba.</strong> Son datos de ejemplo y lo que agregues solo se guarda en este aparato.
      <button type="button" class="enlace" data-accion="reiniciar-demo">Volver a empezar</button></p>
  </div>

  <main class="contenido" id="app">
    <div class="cargando">
      <span class="girando" aria-hidden="true"></span>
      <p>Cargando...</p>
    </div>
  </main>

  <!-- Para elegir la foto de una persona (lo abre el botón "Poner foto") -->
  <input type="file" id="archivo-persona" accept="image/*" class="oculto" tabindex="-1" aria-hidden="true">

  <noscript>
    <p class="contenido">Esta página necesita JavaScript. Ábrela en Chrome o Safari.</p>
  </noscript>

  <!-- Confirmar antes de borrar -->
  <dialog class="dialogo" id="dialogo-borrar" aria-labelledby="dialogo-borrar-titulo">
    <h2 id="dialogo-borrar-titulo">¿Borrar esta opción?</h2>
    <p class="dialogo-texto" id="dialogo-borrar-texto"></p>
    <div class="dialogo-botones">
      <button type="button" class="boton boton-peligro" data-accion="confirmar-borrar">Sí, borrarla</button>
      <button type="button" class="boton boton-secundario" data-accion="cerrar-dialogo">No, dejarla</button>
    </div>
  </dialog>

  <!-- Foto en grande -->
  <dialog class="visor" id="visor" aria-label="Foto en grande">
    <img id="visor-imagen" alt="">
    <button type="button" class="boton boton-principal visor-cerrar" data-accion="cerrar-dialogo">Cerrar</button>
  </dialog>

  <!-- Mensaje de "Guardando..." -->
  <div class="ocupado" id="ocupado" hidden>
    <div class="ocupado-caja" role="status">
      <span class="girando" aria-hidden="true"></span>
      <p id="ocupado-texto">Guardando...</p>
    </div>
  </div>

  <div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>

  <!-- El ?v= obliga a los celulares a bajar la versión nueva: súbelo al cambiar css o js -->
  <script src="js/config.js?v=7"></script>
  <script src="js/app.js?v=7"></script>
</body>
</html>
